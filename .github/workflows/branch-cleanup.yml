name: Branch cleanup

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup-merged-branches:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature and bugfix branches
        uses: actions/github-script@v7
        with:
          script: |
            const headRef = context.payload.pull_request.head.ref;
            const headRepo = context.payload.pull_request.head.repo.full_name;
            const baseRepo = context.payload.pull_request.base.repo.full_name;

            if (!(headRef.startsWith('feature-major/') || headRef.startsWith('feature/') || headRef.startsWith('bugfix/'))) {
              core.info(`Skipping cleanup for ${headRef}.`);
              return;
            }

            if (headRepo !== baseRepo) {
              core.info(`Skipping cleanup for fork branch ${headRepo}:${headRef}.`);
              return;
            }

            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${headRef}`,
            });

            core.info(`Deleted merged branch ${headRef}.`);
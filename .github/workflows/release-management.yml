name: Release management

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_kind:
        description: "Tipo de release para recuperacion manual"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch
      source_branch:
        description: "Rama origen para auditoria y cascada"
        required: true
        default: "hotfix/manual-recovery"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-management-master
  cancel-in-progress: false

jobs:
  tag-release:
    runs-on: ubuntu-latest
    outputs:
      release_kind: ${{ steps.release.outputs.release_kind }}
      source_branch: ${{ steps.release.outputs.source_branch }}
      planned_tag: ${{ steps.release.outputs.planned_tag }}
      tag: ${{ steps.tag.outputs.tag }}
      tag_state: ${{ steps.tag.outputs.tag_state }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - name: Run release check
        shell: bash
        run: bash scripts/check_release.sh --ci

      - name: Resolve release source
        id: release
        uses: actions/github-script@v8
        env:
          MANUAL_RELEASE_KIND: ${{ inputs.release_kind || '' }}
          MANUAL_SOURCE_BRANCH: ${{ inputs.source_branch || '' }}
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('release_kind', process.env.MANUAL_RELEASE_KIND);
              core.setOutput('source_branch', process.env.MANUAL_SOURCE_BRANCH);
              core.setOutput('planned_tag', '');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.sha,
            });
            const mergedPull = associated.data.find(
              (pull) => pull.merged_at && pull.base.ref === 'master' && pull.merge_commit_sha === context.sha,
            ) || associated.data.find(
              (pull) => pull.merged_at && pull.base.ref === 'master',
            );
            if (!mergedPull) {
              throw new Error('Push to master is not associated with a merged pull request. No tag will be created.');
            }

            const sourceBranch = mergedPull.head.ref;
            let releaseKind;
            if (sourceBranch.startsWith('hotfix/')) {
              releaseKind = 'patch';
            } else if (sourceBranch === 'develop') {
              const releaseKindLabels = mergedPull.labels
                .map((label) => label.name)
                .filter((name) => name.startsWith('release-kind:'));
              if (releaseKindLabels.length !== 1) {
                throw new Error(`Release PR #${mergedPull.number} must have exactly one release-kind label.`);
              }
              releaseKind = releaseKindLabels[0].replace('release-kind:', '');
              if (!['major', 'minor', 'patch'].includes(releaseKind)) {
                throw new Error(`Unsupported release kind on PR #${mergedPull.number}: ${releaseKind}`);
              }

              const metadataMatch = (mergedPull.body || '').match(
                /<!-- RELEASE_METADATA\s*([\s\S]*?)\s*RELEASE_METADATA -->/,
              );
              if (!metadataMatch) throw new Error(`Release PR #${mergedPull.number} has no release metadata.`);
              let metadata;
              try {
                metadata = JSON.parse(metadataMatch[1]);
              } catch (error) {
                throw new Error(`Invalid release metadata on PR #${mergedPull.number}: ${error.message}`);
              }
              if (metadata.release_kind !== releaseKind) {
                throw new Error(`Release metadata and label disagree on PR #${mergedPull.number}.`);
              }
              if (!/^v\d+\.\d+\.\d+$/.test(metadata.planned_tag || '')) {
                throw new Error(`Invalid planned tag in release metadata on PR #${mergedPull.number}.`);
              }
              core.setOutput('planned_tag', metadata.planned_tag);
            } else {
              throw new Error(`Unsupported source branch for master release: ${sourceBranch}`);
            }

            core.setOutput('release_kind', releaseKind);
            core.setOutput('source_branch', sourceBranch);

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          source scripts/lib/release.sh
          release_kind="${{ steps.release.outputs.release_kind }}"
            planned_tag="${{ steps.release.outputs.planned_tag }}"
            existing_tag="$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -n "$existing_tag" ]]; then
              if [[ -n "$planned_tag" && "$existing_tag" != "$planned_tag" ]]; then
                echo "error: existing tag $existing_tag does not match planned tag $planned_tag" >&2
                  exit 1
              fi
              echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
              echo "tag_state=existing" >> "$GITHUB_OUTPUT"
              exit 0
          fi

            latest_tag="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -z "$latest_tag" ]]; then
              echo "error: no semver base tag exists" >&2
              exit 1
          fi
          next_tag="$(release_next_tag "$latest_tag" "$release_kind")"
            if [[ -n "$planned_tag" && "$next_tag" != "$planned_tag" ]]; then
              echo "error: calculated tag $next_tag does not match planned tag $planned_tag" >&2
              exit 1
            fi
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "tag_state=new" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.tag.outputs.tag_state == 'new'
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${{ steps.tag.outputs.tag }}"
          if git rev-parse "$tag_name" >/dev/null 2>&1; then
              tag_commit="$(git rev-list -n 1 "$tag_name")"
              if [[ "$tag_commit" == "$GITHUB_SHA" ]]; then
                  echo "Tag $tag_name already points to this release commit."
                  exit 0
              fi
              echo "error: tag $tag_name already points to $tag_commit" >&2
              exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag_name" -m "Release $tag_name"
          git push origin "$tag_name"

      - name: Report tag result
        run: |
          echo "release_tag=${{ steps.tag.outputs.tag }}"
          echo "release_tag_state=${{ steps.tag.outputs.tag_state }}"

  cascade-hotfix:
    needs: tag-release
    if: needs.tag-release.outputs.source_branch != '' && startsWith(needs.tag-release.outputs.source_branch, 'hotfix/')
    runs-on: ubuntu-latest
    steps:
      - name: Create draft cascade PR
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: 'develop...master',
            });
            if (comparison.data.ahead_by === 0) {
              core.info('develop already contains master; no cascade is needed.');
              return;
            }

            const openPulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:master`,
              base: 'develop',
              per_page: 100,
            });
            if (openPulls.data.length > 0) {
              core.info(`Cascade PR #${openPulls.data[0].number} is already open.`);
              return;
            }

            try {
              const pull = await github.rest.pulls.create({
                owner,
                repo,
                head: 'master',
                base: 'develop',
                title: `chore(release) cascada de ${{ needs.tag-release.outputs.tag }} hacia develop`,
                body: [
                  `Sincroniza en develop el hotfix publicado como ${{ needs.tag-release.outputs.tag }}.`,
                  '',
                  'Esta cascada no genera un nuevo incremento de version.',
                ].join('\n'),
                draft: true,
              });
              core.info(`Created draft cascade PR #${pull.data.number}.`);
            } catch (error) {
              if (error.status === 403 && `${error.message}`.includes('not permitted to create')) {
                throw new Error('Tag published / cascade pending. Enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests.');
              }
              throw error;
            }
name: Branch policy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch routing
        shell: bash
        run: |
          set -euo pipefail

          head_ref="${{ github.head_ref }}"
          base_ref="${{ github.base_ref }}"

          if [[ "$head_ref" == feature/* || "$head_ref" == bugfix/* ]]; then
            expected_base="develop"
          elif [[ "$head_ref" == hotfix/* ]]; then
            expected_base="master"
          elif [[ "$head_ref" == master ]]; then
            expected_base="develop"
          elif [[ "$head_ref" == "3-titulo-de-mercado-a-indice-y-divisas" ]]; then
            expected_base="develop"
          else
            echo "error: unsupported branch prefix for PR head: $head_ref"
            echo "allowed: feature/*, bugfix/*, hotfix/*, master for cascade PRs, or the legacy branch 3-titulo-de-mercado-a-indice-y-divisas"
            exit 1
          fi

          if [[ "$base_ref" != "$expected_base" ]]; then
            echo "error: $head_ref debe apuntar a $expected_base y no a $base_ref"
            exit 1
          fi

      - name: Validate commit message convention
        if: github.head_ref != 'master'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "${{ github.base_ref }}" --depth=1
          bash scripts/check_commit_messages.sh --range "origin/${{ github.base_ref }}..HEAD"

      - name: Delete merged feature and bugfix branches
        if: github.event.pull_request.merged == true
        uses: actions/github-script@v7
        with:
          script: |
            const headRef = context.payload.pull_request.head.ref;
            const headRepo = context.payload.pull_request.head.repo.full_name;
            const baseRepo = context.payload.pull_request.base.repo.full_name;

            if (!(headRef.startsWith('feature/') || headRef.startsWith('bugfix/'))) {
              core.info(`Skipping cleanup for ${headRef}.`);
              return;
            }

            if (headRepo !== baseRepo) {
              core.info(`Skipping cleanup for fork branch ${headRepo}:${headRef}.`);
              return;
            }

            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${headRef}`,
            });

            core.info(`Deleted merged branch ${headRef}.`);